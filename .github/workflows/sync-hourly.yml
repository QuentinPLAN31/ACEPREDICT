name: Sync Hourly (fixtures, classements, cotes, météo)

# Toutes les 3h pour rester sous le quota gratuit de LiveTennisAPI
# (plan free : 100 requêtes/jour, pas de carte requise, pas d'expiration —
# cf. https://livetennisapi.com/subscribe/free). 8 exécutions/jour x
# ~4 requêtes de base (rankings+fixtures pour ATP et WTA) = 32/jour,
# large marge pour les lookups de ville/joueur mis en cache.
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch: {}

jobs:
  sync-hourly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acepredict-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync_hourly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
        run: python -m scripts.sync_hourly
