name: Sync Hourly (fixtures, classements, cotes, météo)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

jobs:
  sync-hourly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acepredict-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync_hourly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python -m scripts.sync_hourly
