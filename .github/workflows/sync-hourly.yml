name: Sync Hourly (fixtures, classements, cotes, météo)

# Cron réglé sur le quota du plan FREE de LiveTennisAPI (100 req/jour, cf.
# https://livetennisapi.com/subscribe/free) : toutes les 3h = ~32
# requêtes/jour de base, marge pour les lookups ville/joueur mis en cache.
# Site commercial -> passer au plan Basic ($9.99/mo, 1000/j + historique/H2H)
# ou Pro ($29.99/mo, 10000/j + cotes marché) dès que le trafic réel le
# justifie, puis remettre ce cron sur toutes les heures ("5 * * * *").
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch: {}

jobs:
  sync-hourly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acepredict-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync_hourly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIVETENNISAPI_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python -m scripts.sync_hourly
